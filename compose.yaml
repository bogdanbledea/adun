# Runs the image with a hardened container. Settings go in .env next to this
# file (copy .env.example). The app listens on 127.0.0.1:8080 of the host
# only, for a reverse proxy on the same machine that serves it over HTTPS.
#
#   docker compose up -d            pulls the published image
#   docker compose up -d --build    builds it from this checkout instead

name: adun

services:
  app:
    image: ${ADUN_IMAGE:-bogdanbledea/adun:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ADUN_DATA_DIR: /data
      PORT: "8080"
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - adun-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    # Longer than the app's own 10-second deadline for requests in flight.
    stop_grace_period: 20s

volumes:
  adun-data:
