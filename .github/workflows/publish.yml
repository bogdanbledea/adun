# Builds the image of a published release for amd64 and arm64 and pushes it
# to Docker Hub as 1.2.3, 1.2, 1 and, for the newest release, latest. The
# release workflow already ran CI on the same commit. The Docker Hub
# credentials (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN) are secrets of the
# docker-hub environment, which only v* tags may use, after an approval.

name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: bogdanbledea/adun

jobs:
  image:
    runs-on: ubuntu-latest
    environment: docker-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # A patch to an older line (1.0.4 after 2.0.0) must not move latest.
      - name: Choose the tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::$TAG is not vX.Y.Z"
            exit 1
          }
          version=${TAG#v}
          minor=${version%.*}
          major=${minor%.*}
          tags="$IMAGE:$version,$IMAGE:$minor,$IMAGE:$major"
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=image

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: echo "Pushed $TAGS" >> "$GITHUB_STEP_SUMMARY"
